<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Turn CSV into clean Markdown, HTML, or tab-separated tables locally."><title>Tablecraft</title>
<style>
:root{font:16px/1.5 system-ui,sans-serif;color:#19253b;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:28px 20px 60px}header,.controls,.headrow{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:clamp(2rem,5vw,3rem);line-height:1.05;margin:0}.eyebrow{color:#4764c2;font-size:.78rem;font-weight:750;letter-spacing:.09em;text-transform:uppercase}p{color:#647087}.card{padding:18px;border:1px solid #dfe5ef;border-radius:16px;background:white;margin-top:16px}textarea{width:100%;min-height:230px;border:1px solid #d8dfeb;border-radius:10px;padding:14px;font:14px/1.55 ui-monospace,Consolas,monospace;resize:vertical}button,select{font:inherit;border:0;border-radius:9px;padding:10px 14px;background:#294887;color:white;font-weight:700;cursor:pointer}button.secondary,select{background:#e8edf6;color:#293d68}button:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #f0ad3d;outline-offset:2px}.controls{justify-content:flex-start;flex-wrap:wrap}.toggle{display:flex;align-items:center;gap:8px}.output-head{display:flex;justify-content:space-between;align-items:center}.output{min-height:210px}.preview{overflow:auto;max-height:330px}.preview table{border-collapse:collapse;min-width:100%}.preview th,.preview td{padding:8px 11px;text-align:left;border:1px solid #dfe5ef}.preview th{background:#edf1f8}.status{min-height:28px;color:#216b46}.bad{color:#a43232}.muted{font-size:.9rem}.privacy{background:#edf5ee;padding:12px 14px;border-radius:9px;color:#24543a;font-size:.9rem}@media(max-width:650px){.wrap{padding:22px 14px}header{align-items:flex-start}.card{padding:14px}}
</style></head><body><main class="wrap"><header><div><div class="eyebrow">From rows to ready-to-paste</div><h1>Tablecraft</h1><p id="intro">Convert CSV into Markdown, HTML, or TSV — no upload, no fuss.</p></div><button class="secondary" id="lang">Nederlands</button></header>
<section class="card"><div class="headrow"><h2 id="sourceLabel">Paste your CSV</h2><button class="secondary" id="sample">Load sample</button></div><textarea id="source" spellcheck="false" placeholder="Name,Role,Team&#10;Ada,Engineer,Platform&#10;Linus,Designer,Product" aria-label="CSV input"></textarea><div class="controls"><label for="delimiter" id="delimiterLabel">Delimiter</label><select id="delimiter"><option id="commaOption" value=",">Comma (,)</option><option id="semicolonOption" value=";">Semicolon (;)</option><option id="tabOption" value="tab">Tab</option></select><label class="toggle"><input id="header" type="checkbox" checked><span id="headerLabel">First row is header</span></label><button id="convert">Convert</button></div><div id="status" class="status" role="status" aria-live="polite"></div></section>
<section class="card"><div class="output-head"><h2 id="resultLabel">Markdown output</h2><div class="controls"><select id="format" aria-label="Output format"><option value="md">Markdown</option><option value="html">HTML</option><option value="tsv">TSV</option></select><button class="secondary" id="copy">Copy</button></div></div><textarea class="output" id="result" readonly aria-label="Converted table output"></textarea></section>
<section class="card"><h2 id="previewLabel">Preview</h2><div class="preview" id="preview"></div></section><p class="privacy" id="privacy">Your data stays in this browser. Nothing is uploaded.</p></main>
<script>
const $=id=>document.getElementById(id);let nl=false,rows=[];
function parseCSV(text,delimiter){const out=[];let row=[],cell='',quoted=false,afterQuote=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"'){quoted=false;afterQuote=true}else cell+=c;continue}if(afterQuote){if(c===delimiter){row.push(cell);cell='';afterQuote=false}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);cell='';afterQuote=false;if(row.some(v=>v!==''))out.push(row);row=[]}else if(c===' '||c==='\t')continue;else throw Error(nl?'Onverwachte tekst na een afgesloten veld.':'Unexpected text after a closed field.');continue}if(c===delimiter){row.push(cell);cell=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);cell='';if(row.some(v=>v!==''))out.push(row);row=[]}else if(c==='"'){if(cell.length)throw Error(nl?'Dubbel aanhalingsteken midden in een veld.':'Unexpected quote inside an unquoted field.');quoted=true}else cell+=c}if(quoted)throw Error(nl?'Niet-afgesloten aanhalingsteken.':'Unclosed quoted field.');row.push(cell);if(row.some(v=>v!==''))out.push(row);if(!out.length)throw Error(nl?'Plak eerst CSV-gegevens.':'Paste some CSV data first.');const width=Math.max(...out.map(r=>r.length));if(out.some(r=>r.length!==width))throw Error(nl?'Niet elke rij heeft evenveel kolommen.':'Rows do not all have the same number of columns.');return out}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function render(){const format=$('format').value;let data=rows;if(!data.length){$('result').value='';$('preview').replaceChildren();return}const firstHeader=$('header').checked;let head=firstHeader?data[0]:data[0].map((_,i)=>`Column ${i+1}`),body=firstHeader?data.slice(1):data;
if(format==='md'){$('result').value='| '+head.map(s=>s.replace(/\|/g,'\\|')).join(' | ')+' |\n| '+head.map(()=> '---').join(' | ')+' |\n'+body.map(r=>'| '+r.map(s=>s.replace(/\|/g,'\\|').replace(/\n/g,' ')).join(' | ')+' |').join('\n')}
if(format==='tsv'){$('result').value=[head,...body].map(r=>r.join('\t')).join('\n')}
if(format==='html'){$('result').value='<table>\n  <thead><tr>'+head.map(s=>`<th>${esc(s)}</th>`).join('')+'</tr></thead>\n  <tbody>\n'+body.map(r=>'    <tr>'+r.map(s=>`<td>${esc(s)}</td>`).join('')+'</tr>').join('\n')+'\n  </tbody>\n</table>'}
$('resultLabel').textContent=({md:'Markdown output',html:'HTML output',tsv:'TSV output'})[format];if(nl)$('resultLabel').textContent=({md:'Markdown-uitvoer',html:'HTML-uitvoer',tsv:'TSV-uitvoer'})[format];
const table=document.createElement('table'),thead=document.createElement('thead'),tr=document.createElement('tr');head.forEach(v=>{const th=document.createElement('th');th.textContent=v;tr.append(th)});thead.append(tr);const tbody=document.createElement('tbody');body.forEach(r=>{const tr=document.createElement('tr');r.forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.append(td)});tbody.append(tr)});table.append(thead,tbody);$('preview').replaceChildren(table)}
$('convert').onclick=()=>{try{const sep=$('delimiter').value==='tab'?'\t':$('delimiter').value;rows=parseCSV($('source').value,sep);render();$('status').textContent=nl?`${rows.length} rijen verwerkt.`:`${rows.length} rows parsed.`;$('status').className='status'}catch(e){$('status').textContent=e.message;$('status').className='status bad';$('result').value='';$('preview').replaceChildren()}};
$('format').onchange=render;$('header').onchange=render;$('sample').onclick=()=>{$('source').value='Name,Role,Team\nAda,Engineer,Platform\nLinus,Designer,Product\nGrace,"Research, Systems",Infrastructure';$('convert').click()};
$('copy').onclick=async()=>{if(!$('result').value){$('status').textContent=nl?'Converteer eerst gegevens.':'Convert some data first.';$('status').className='status bad';return}try{await navigator.clipboard.writeText($('result').value);$('status').textContent=nl?'Tabel gekopieerd.':'Table copied.';$('status').className='status'}catch{$('status').textContent=nl?'Kopiëren niet beschikbaar; selecteer de uitvoer handmatig.':'Clipboard unavailable; select the output manually.';$('status').className='status bad'}};
$('lang').onclick=()=>{nl=!nl;document.documentElement.lang=nl?'nl':'en';$('lang').textContent=nl?'English':'Nederlands';$('intro').textContent=nl?'Zet CSV om in Markdown, HTML of TSV — zonder uploads.':'Convert CSV into Markdown, HTML, or TSV — no upload, no fuss.';$('sourceLabel').textContent=nl?'Plak je CSV':'Paste your CSV';$('sample').textContent=nl?'Voorbeeld laden':'Load sample';$('delimiterLabel').textContent=nl?'Scheidingsteken':'Delimiter';$('commaOption').textContent=nl?'Komma (,)':'Comma (,)';$('semicolonOption').textContent=nl?'Puntkomma (;)':'Semicolon (;)';$('tabOption').textContent=nl?'Tab':'Tab';$('headerLabel').textContent=nl?'Eerste rij is kopregel':'First row is header';$('convert').textContent=nl?'Omzetten':'Convert';$('copy').textContent=nl?'Kopiëren':'Copy';$('previewLabel').textContent=nl?'Voorbeeld':'Preview';$('privacy').textContent=nl?'Je gegevens blijven in deze browser. Er wordt niets geüpload.':'Your data stays in this browser. Nothing is uploaded.';render()};
</script></main></body></html>
